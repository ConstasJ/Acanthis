server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	location = /config.js {
		add_header Cache-Control "no-store, max-age=0";
		try_files $uri =404;
	}

	location = /sw.js {
		add_header Cache-Control "no-store, max-age=0";
		try_files $uri =404;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
