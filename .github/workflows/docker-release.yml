name: Docker Release

on:
  push:
    tags:
      - "@acanthis-dec/api-server@*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (defaults to apps/api-server/package.json version)"
        required: false
        type: string

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish release image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve Docker semver version
        id: version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "${GITHUB_REF_NAME}" == @acanthis-dec/api-server@* ]]; then
            RAW_VERSION="${GITHUB_REF_NAME#@acanthis-dec/api-server@}"
            VERSION="${RAW_VERSION#v}"
          else
            VERSION="$(jq -r '.version' apps/api-server/package.json)"
          fi

          if [ -z "${VERSION}" ] || [ "${VERSION}" = "null" ]; then
            echo "Failed to resolve api-server version" >&2
            exit 1
          fi

          IS_PRERELEASE=false
          if [[ "${VERSION}" == *-* ]]; then
            IS_PRERELEASE=true
          fi

          echo "VERSION=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download libcurl-impersonate
        uses: robinraju/release-downloader@v1
        with:
          repository: lexiforest/curl-impersonate
          latest: true
          fileName: libcurl-impersonate-*.x86_64-linux-gnu.tar.gz

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/constasj/acanthis-api-server
            constasj0721/acanthis-api-server
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.VERSION }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.VERSION }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_prerelease == 'false' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api-server-release
          cache-to: type=gha,mode=max,scope=api-server-release
