name: Publish Artifacts

on:
  push:
    tags:
      - "@acanthis-dec/api-server@*"
      - "@acanthis-dec/web@*"
      - "@acanthis-dec/cli@*"
  workflow_dispatch:
    inputs:
      target:
        description: "Artifact target to publish"
        required: true
        type: choice
        options:
          - api-server
          - web
          - cli
      version:
        description: "Release version (defaults to the target package.json version)"
        required: false
        type: string

concurrency:
  group: publish-artifacts-${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  api-server-docker:
    name: Publish api-server Docker image
    if: >-
      (github.event_name == 'push' && startsWith(github.ref_name, '@acanthis-dec/api-server@')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'api-server')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve Docker semver version
        id: version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "${GITHUB_REF_NAME}" == @acanthis-dec/api-server@* ]]; then
            RAW_VERSION="${GITHUB_REF_NAME#@acanthis-dec/api-server@}"
            VERSION="${RAW_VERSION#v}"
          else
            VERSION="$(jq -r '.version' apps/api-server/package.json)"
          fi

          if [ -z "${VERSION}" ] || [ "${VERSION}" = "null" ]; then
            echo "Failed to resolve api-server version" >&2
            exit 1
          fi

          IS_PRERELEASE=false
          if [[ "${VERSION}" == *-* ]]; then
            IS_PRERELEASE=true
          fi

          echo "VERSION=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Ensure runtime base image
        id: runtime
        uses: ./.github/actions/ensure-api-server-runtime

      - name: Check promotable canary build
        id: promote
        env:
          RUNTIME_IMAGE: ${{ steps.runtime.outputs.image }}
        run: |
          set -euo pipefail
          BUILD_HASH="$(node .github/scripts/api-server-build-hash.mjs --runtime-image "${RUNTIME_IMAGE}")"
          BUILD_TAG="build-${BUILD_HASH}"
          CANDIDATE_REF="ghcr.io/constasj/acanthis-api-server:${BUILD_TAG}"
          echo "tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"

          if DIGEST="$(docker buildx imagetools inspect "${CANDIDATE_REF}" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"\r\n')" && [ -n "${DIGEST}" ] && [ "${DIGEST}" != "null" ]; then
            echo "Found matching build ${CANDIDATE_REF}@${DIGEST}; skipping Buildx build and promoting via crane."
            echo "can_promote=true" >> "$GITHUB_OUTPUT"
            echo "source_ref=${CANDIDATE_REF}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "No matching build found for ${CANDIDATE_REF}; falling back to full Buildx build."
            echo "can_promote=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/constasj/acanthis-api-server
            constasj0721/acanthis-api-server
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.VERSION }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.VERSION }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_prerelease == 'false' }}

      - name: Set up crane
        if: steps.promote.outputs.can_promote == 'true'
        uses: imjasonh/setup-crane@v0.7
        with:
          version: v0.22.1

      - name: Promote existing image with release metadata
        if: steps.promote.outputs.can_promote == 'true'
        env:
          SOURCE_REF: ${{ steps.promote.outputs.source_ref }}
          PRIMARY_REPO: ghcr.io/constasj/acanthis-api-server
          PLATFORM: linux/amd64
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
        run: node .github/scripts/promote-api-server-image.mjs

      - name: Build and push Docker image
        if: steps.promote.outputs.can_promote != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api-server/Dockerfile
          platforms: linux/amd64
          build-args: RUNTIME_IMAGE=${{ steps.runtime.outputs.image }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ghcr.io/constasj/acanthis-api-server:${{ steps.promote.outputs.tag }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=registry,oci-mediatypes=true,compression=zstd,compression-level=6
          cache-from: type=registry,ref=ghcr.io/constasj/acanthis-api-server:buildcache
          cache-to: type=registry,ref=ghcr.io/constasj/acanthis-api-server:buildcache,mode=max,oci-mediatypes=true,compression=zstd,compression-level=6,image-manifest=true

  api-server-deploy:
    name: Deploy api-server via Baletta
    needs: api-server-docker
    if: >-
      needs.api-server-docker.result == 'success' &&
      needs.api-server-docker.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      BALETTA_API_KEY: ${{ secrets.BALETTA_API_KEY }}
    steps:
      - name: Skip deployment when Baletta secret is not configured
        if: env.BALETTA_API_KEY == ''
        run: echo "BALETTA_API_KEY is not configured; skipping Baletta deployment."

      - name: Trigger Baletta deployment
        if: env.BALETTA_API_KEY != ''
        uses: constasj/baletta-action@v1
        with:
          api-url: ${{ vars.BALETTA_API_URL || 'https://api.infini-fantasy.com/baletta' }}
          api-key: ${{ secrets.BALETTA_API_KEY }}
          project: ${{ vars.BALETTA_PROJECT || 'acanthis' }}
          retry-attempts: 3

  web-static:
    name: Publish web static archive
    if: >-
      (github.event_name == 'push' && startsWith(github.ref_name, '@acanthis-dec/web@')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'web')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --filter=@acanthis-dec/web... --frozen-lockfile

      - name: Build web client
        run: pnpm --filter=@acanthis-dec/web... run build

      - name: Resolve version and release tag
        id: meta
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "${GITHUB_REF_NAME}" == @acanthis-dec/web@* ]]; then
            RAW_VERSION="${GITHUB_REF_NAME#@acanthis-dec/web@}"
            VERSION="${RAW_VERSION#v}"
          else
            VERSION="$(jq -r '.version' apps/web/package.json)"
          fi

          if [ -z "${VERSION}" ] || [ "${VERSION}" = "null" ]; then
            echo "Failed to resolve Web version" >&2
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="@acanthis-dec/web@${VERSION}"
          fi

          IS_PRERELEASE=false
          if [[ "${VERSION}" == *-* ]]; then
            IS_PRERELEASE=true
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Package static distribution archive
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          OUT_DIR="release-artifacts"
          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"
          (
            cd apps/web/dist
            zip -r "../../../${OUT_DIR}/acanthis-web-v${VERSION}-dist.zip" .
          )
          (
            cd "${OUT_DIR}"
            sha256sum "acanthis-web-v${VERSION}-dist.zip" > SHA256SUMS.txt
          )

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            release-artifacts/acanthis-web-v*.zip
            release-artifacts/SHA256SUMS.txt

  web-esa-pages:
    name: Deploy web to Aliyun ESA Pages
    needs: web-static
    if: >-
      needs.web-static.result == 'success' &&
      needs.web-static.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ALIYUN_OIDC_PROVIDER_ARN: ${{ secrets.ALIYUN_OIDC_PROVIDER_ARN }}
      ALIYUN_ESA_ROLE_ARN: ${{ secrets.ALIYUN_ESA_ROLE_ARN }}
      ESA_NO_UPDATE_CHECK: "1"
    steps:
      - name: Skip deployment when Aliyun OIDC secrets are not configured
        if: env.ALIYUN_OIDC_PROVIDER_ARN == '' || env.ALIYUN_ESA_ROLE_ARN == ''
        run: echo "ALIYUN_OIDC_PROVIDER_ARN / ALIYUN_ESA_ROLE_ARN not configured; skipping ESA Pages deployment."

      - name: Checkout repository
        if: env.ALIYUN_OIDC_PROVIDER_ARN != '' && env.ALIYUN_ESA_ROLE_ARN != ''
        uses: actions/checkout@v6

      - name: Configure Alibaba Cloud STS credentials via OIDC
        if: env.ALIYUN_OIDC_PROVIDER_ARN != '' && env.ALIYUN_ESA_ROLE_ARN != ''
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          oidc-provider-arn: ${{ secrets.ALIYUN_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ secrets.ALIYUN_ESA_ROLE_ARN }}
          role-session-name: acanthis-web-esa-cd
          audience: ${{ vars.ALIYUN_OIDC_AUDIENCE || 'sts.aliyuncs.com' }}

      - name: Set up pnpm
        if: env.ALIYUN_OIDC_PROVIDER_ARN != '' && env.ALIYUN_ESA_ROLE_ARN != ''
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        if: env.ALIYUN_OIDC_PROVIDER_ARN != '' && env.ALIYUN_ESA_ROLE_ARN != ''
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: env.ALIYUN_OIDC_PROVIDER_ARN != '' && env.ALIYUN_ESA_ROLE_ARN != ''
        run: pnpm install --filter=@acanthis-dec/web... --frozen-lockfile

      - name: Build web client for ESA Pages
        if: env.ALIYUN_OIDC_PROVIDER_ARN != '' && env.ALIYUN_ESA_ROLE_ARN != ''
        env:
          VITE_DEFAULT_API_BASE_URL: ${{ vars.ESA_DEFAULT_API_BASE_URL || 'https://api.infini-fantasy.com/acanthis' }}
        run: pnpm --filter=@acanthis-dec/web... run build

      - name: Deploy to Aliyun ESA Pages
        if: env.ALIYUN_OIDC_PROVIDER_ARN != '' && env.ALIYUN_ESA_ROLE_ARN != ''
        run: |
          pnpm dlx esa-cli@1 deploy \
            --environment production \
            --no-preview \
            --description "Release @acanthis-dec/web@${{ needs.web-static.outputs.version }}"

  web-docker:
    name: Publish web Docker image
    if: >-
      (github.event_name == 'push' && startsWith(github.ref_name, '@acanthis-dec/web@')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'web')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve Docker semver version
        id: meta
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "${GITHUB_REF_NAME}" == @acanthis-dec/web@* ]]; then
            RAW_VERSION="${GITHUB_REF_NAME#@acanthis-dec/web@}"
            VERSION="${RAW_VERSION#v}"
          else
            VERSION="$(jq -r '.version' apps/web/package.json)"
          fi

          if [ -z "${VERSION}" ] || [ "${VERSION}" = "null" ]; then
            echo "Failed to resolve Web version" >&2
            exit 1
          fi

          IS_PRERELEASE=false
          if [[ "${VERSION}" == *-* ]]; then
            IS_PRERELEASE=true
          fi

          echo "docker_version=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/constasj/acanthis-web
            constasj0721/acanthis-web
          tags: |
            type=semver,pattern={{version}},value=${{ steps.meta.outputs.docker_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.meta.outputs.docker_version }}
            type=semver,pattern={{major}},value=${{ steps.meta.outputs.docker_version }}
            type=raw,value=latest,enable=${{ steps.meta.outputs.is_prerelease == 'false' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha,scope=web-release
          cache-to: type=gha,mode=max,scope=web-release

  cli-build:
    name: Build CLI binaries and manifests
    if: >-
      (github.event_name == 'push' && startsWith(github.ref_name, '@acanthis-dec/cli@')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'cli')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version and release tag
        id: meta
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "${GITHUB_REF_NAME}" == @acanthis-dec/cli@* ]]; then
            RAW_VERSION="${GITHUB_REF_NAME#@acanthis-dec/cli@}"
            VERSION="${RAW_VERSION#v}"
          else
            VERSION="$(jq -r '.version' apps/cli/package.json)"
          fi

          if [ -z "${VERSION}" ] || [ "${VERSION}" = "null" ]; then
            echo "Failed to resolve CLI version" >&2
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="@acanthis-dec/cli@${VERSION}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Compile cross-platform standalone binaries
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          OUT_DIR="release-artifacts"
          STAGE_DIR="release-stage"
          rm -rf "${OUT_DIR}" "${STAGE_DIR}"
          mkdir -p "${OUT_DIR}" "${STAGE_DIR}"

          for pair in \
            "bun-darwin-arm64 darwin-arm64" \
            "bun-darwin-x64 darwin-x64" \
            "bun-linux-arm64 linux-arm64" \
            "bun-linux-x64 linux-x64"; do
            set -- $pair
            BUN_TARGET="$1"
            LABEL="$2"
            TARGET_STAGE="${STAGE_DIR}/${LABEL}"
            mkdir -p "${TARGET_STAGE}"
            bun build ./apps/cli/src/index.ts \
              --compile \
              --minify \
              --target="${BUN_TARGET}" \
              --outfile "${TARGET_STAGE}/acanthis"
            chmod +x "${TARGET_STAGE}/acanthis"
            tar -C "${TARGET_STAGE}" -czf "${OUT_DIR}/acanthis-v${VERSION}-${LABEL}.tar.gz" acanthis
          done

          WIN_STAGE="${STAGE_DIR}/windows-x64"
          mkdir -p "${WIN_STAGE}"
          bun build ./apps/cli/src/index.ts \
            --compile \
            --minify \
            --target=bun-windows-x64 \
            --outfile "${WIN_STAGE}/acanthis.exe"
          zip -j "${OUT_DIR}/acanthis-v${VERSION}-windows-x64.zip" "${WIN_STAGE}/acanthis.exe"

          (
            cd "${OUT_DIR}"
            sha256sum \
              "acanthis-v${VERSION}-darwin-arm64.tar.gz" \
              "acanthis-v${VERSION}-darwin-x64.tar.gz" \
              "acanthis-v${VERSION}-linux-arm64.tar.gz" \
              "acanthis-v${VERSION}-linux-x64.tar.gz" \
              "acanthis-v${VERSION}-windows-x64.zip" > SHA256SUMS.txt
          )

      - name: Generate Homebrew and WinGet manifests
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          bun apps/cli/scripts/generate-manifests.ts \
            --version "${VERSION}" \
            --repo "${{ github.repository }}" \
            --tag "${{ steps.meta.outputs.tag }}" \
            --checksums "release-artifacts/SHA256SUMS.txt" \
            --out-dir "release-manifests"
          (
            cd release-manifests
            zip -r "../release-artifacts/winget-manifests-v${VERSION}.zip" manifests
          )

      - name: Upload binary release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cli-release-artifacts
          path: release-artifacts

      - name: Upload package manager manifests
        uses: actions/upload-artifact@v7
        with:
          name: cli-release-manifests
          path: release-manifests

  cli-release:
    name: Publish CLI GitHub Release
    needs: cli-build
    if: needs.cli-build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binary release artifacts
        uses: actions/download-artifact@v8
        with:
          name: cli-release-artifacts
          path: release-artifacts

      - name: Download package manager manifests
        uses: actions/download-artifact@v8
        with:
          name: cli-release-manifests
          path: release-manifests

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.cli-build.outputs.tag }}
          files: |
            release-artifacts/acanthis-v*.tar.gz
            release-artifacts/acanthis-v*.zip
            release-artifacts/SHA256SUMS.txt
            release-artifacts/winget-manifests-v*.zip
            release-manifests/Formula/acanthis.rb

  cli-homebrew:
    name: Update Homebrew Tap
    needs: [cli-build, cli-release]
    if: needs.cli-release.result == 'success' && vars.HOMEBREW_TAP_REPO != ''
    runs-on: ubuntu-latest
    env:
      PACKAGE_MANAGER_TOKEN: ${{ secrets.PACKAGE_MANAGER_TOKEN }}
    steps:
      - name: Download package manager manifests
        if: env.PACKAGE_MANAGER_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: cli-release-manifests
          path: release-manifests

      - name: Checkout Homebrew Tap repository
        if: env.PACKAGE_MANAGER_TOKEN != ''
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPO }}
          token: ${{ secrets.PACKAGE_MANAGER_TOKEN }}
          path: homebrew-tap

      - name: Update Formula and push commit
        if: env.PACKAGE_MANAGER_TOKEN != ''
        run: |
          mkdir -p homebrew-tap/Formula
          cp release-manifests/Formula/acanthis.rb homebrew-tap/Formula/acanthis.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/acanthis.rb
          if git diff --cached --quiet; then
            echo "Formula/acanthis.rb unchanged, skipping commit."
          else
            git commit -m "acanthis ${{ needs.cli-build.outputs.version }}"
            git push
          fi

  cli-winget:
    name: Submit WinGet package update
    needs: [cli-build, cli-release]
    if: needs.cli-release.result == 'success' && vars.ENABLE_WINGET_RELEASE == 'true'
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit to microsoft/winget-pkgs
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: ConstasJ.Acanthis
          version: ${{ needs.cli-build.outputs.version }}
          installers-regex: '^acanthis-v.*-windows-x64\.zip$'
          release-tag: ${{ needs.cli-build.outputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}
