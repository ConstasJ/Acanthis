name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - ".changeset/**"
      - "LICENSE"
      - ".github/workflows/canary.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/cli-release.yml"
      - ".github/workflows/docker-release.yml"
      - ".github/workflows/web-release.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - ".changeset/**"
      - "LICENSE"
      - ".github/workflows/canary.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/cli-release.yml"
      - ".github/workflows/docker-release.yml"
      - ".github/workflows/web-release.yml"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    if: >-
      github.head_ref != 'changeset-release/master' &&
      !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Version Packages'))
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm run lint

      - name: Type check
        run: pnpm run check-types:affected

      - name: Build
        run: pnpm run build:affected
