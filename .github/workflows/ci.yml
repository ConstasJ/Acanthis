name: CI workflow for master branch

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      api-server: ${{ steps.changes.outputs.api-server }}
      packages: ${{ steps.changes.outputs.packages }}
      ci: ${{ steps.changes.outputs.ci }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect change paths
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            api-server:
              - 'apps/api-server/src/**/*.ts'
              - 'apps/api-server/package.json'
              - 'apps/api-server/tsconfig.json'
              - 'apps/api-server/build.ts'
            packages:
              - 'packages/*/src/**/*.ts'
              - 'packages/*/package.json'
              - 'packages/*/tsconfig.json'
              - 'packages/*/tsdown.config.ts'
            ci:
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/docker-release.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
  quality:
    needs: changes
    name: Quality
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm run lint

      - name: Type check
        run: pnpm run check-types:affected

      - name: Build
        run: pnpm run build:affected

  release:
    name: Create release PR and publish packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [changes, quality]
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR and publish packages
        uses: changesets/action@v1
        with:
          publish: pnpm release

  docker-canary:
    name: Publish canary image
    needs: [changes, quality]
    if: |
      github.event_name == 'push' && 
      github.ref == 'refs/heads/master' && 
      (needs.changes.outputs.packages == 'true' || needs.changes.outputs.api-server == 'true' || needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download libcurl-impersonate
        uses: robinraju/release-downloader@v1
        with:
          repository: lexiforest/curl-impersonate
          latest: true
          fileName: libcurl-impersonate-*.x86_64-linux-gnu.tar.gz

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/constasj/acanthis-api-server
          tags: |
            type=raw,value=canary
            type=sha,prefix=canary-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
