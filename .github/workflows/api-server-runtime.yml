name: API Server Runtime

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Bypass build cache and force rebuild runtime base image"
        type: boolean
        default: true

concurrency:
  group: api-server-runtime-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  runtime:
    name: Build api-server runtime base image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure runtime base image
        uses: ./.github/actions/ensure-api-server-runtime
        with:
          force-rebuild: ${{ inputs.force_rebuild }}
