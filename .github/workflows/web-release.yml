name: Web Release

on:
  push:
    tags:
      - "@acanthis-dec/web@*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (defaults to apps/web/package.json version)"
        required: false
        type: string

concurrency:
  group: web-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-static:
    name: Build and release static archive
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --filter=@acanthis-dec/web... --frozen-lockfile

      - name: Build web client
        run: pnpm --filter=@acanthis-dec/web... run build

      - name: Resolve version and release tag
        id: meta
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "${GITHUB_REF_NAME}" == @acanthis-dec/web@* ]]; then
            RAW_VERSION="${GITHUB_REF_NAME#@acanthis-dec/web@}"
            VERSION="${RAW_VERSION#v}"
          else
            VERSION="$(jq -r '.version' apps/web/package.json)"
          fi

          if [ -z "${VERSION}" ] || [ "${VERSION}" = "null" ]; then
            echo "Failed to resolve Web version" >&2
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="@acanthis-dec/web@${VERSION}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Package static distribution archive
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          OUT_DIR="release-artifacts"
          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"
          (
            cd apps/web/dist
            zip -r "../../../${OUT_DIR}/acanthis-web-v${VERSION}-dist.zip" .
          )
          (
            cd "${OUT_DIR}"
            sha256sum "acanthis-web-v${VERSION}-dist.zip" > SHA256SUMS.txt
          )

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            release-artifacts/acanthis-web-v*.zip
            release-artifacts/SHA256SUMS.txt

  docker:
    name: Publish release image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve Docker semver version
        id: meta
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "${GITHUB_REF_NAME}" == @acanthis-dec/web@* ]]; then
            RAW_VERSION="${GITHUB_REF_NAME#@acanthis-dec/web@}"
            VERSION="${RAW_VERSION#v}"
          else
            VERSION="$(jq -r '.version' apps/web/package.json)"
          fi

          if [ -z "${VERSION}" ] || [ "${VERSION}" = "null" ]; then
            echo "Failed to resolve Web version" >&2
            exit 1
          fi

          echo "docker_version=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/constasj/acanthis-web
            constasj0721/acanthis-web
          tags: |
            type=semver,pattern={{version}},value=${{ steps.meta.outputs.docker_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.meta.outputs.docker_version }}
            type=semver,pattern={{major}},value=${{ steps.meta.outputs.docker_version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha,scope=web-release
          cache-to: type=gha,mode=max,scope=web-release
