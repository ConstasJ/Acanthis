name: Docker Canary

on:
  push:
    branches:
      - master
    paths:
      - apps/api-server/**
      - packages/**
      - tools/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .dockerignore
      - .github/workflows/docker-canary.yml

concurrency:
  group: docker-canary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish canary image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download libcurl-impersonate
        uses: robinraju/release-downloader@v1
        with:
          repository: lexiforest/curl-impersonate
          latest: true
          fileName: libcurl-impersonate-*-x86_64-linux-gnu.tar.gz
          out-file-path: libcurl-impersonate.tar.gz

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/constasj/acanthis-api-server
          tags: |
            type=raw,value=canary
            type=sha,prefix=canary-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
