packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'

allowBuilds:
  better-sqlite3: true
  esbuild: true
  isolated-vm: true
  koffi: true

catalog:
  tsdown: '0.22.2'
  typescript: '6.0.3'
  '@types/node': '25.9.2'
  tsx: '4.22.4'

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.9.17'
  - '@turbo/darwin-arm64@2.9.17'
  - '@turbo/linux-64@2.9.17'
  - '@turbo/linux-arm64@2.9.17'
  - '@turbo/windows-64@2.9.17'
  - '@turbo/windows-arm64@2.9.17'
  - turbo@2.9.17
  - '@constasj/impers@0.0.8'
