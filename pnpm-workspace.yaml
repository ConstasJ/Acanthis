packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'

allowBuilds:
  better-sqlite3: true
  esbuild: true
  isolated-vm: true
  koffi: true
  onnxruntime-node: true

catalog:
  tsdown: '0.23.7'
  typescript: '7.0.2'
  '@types/node': '26.6.6'
  tsx: '4.23.15'

minimumReleaseAge: 0

permissions:
  dotenv:
    skills: [dotenv, dotenvx]
  drizzle-kit:
    skills: true

  tsdown:
    skills: true
skills:
  dirs:
    - .agent/skills
    - .gemini/skills
